[project]
name = "ttalloc"
version = "0.1.0"
description = "Phân bổ thích ứng tài nguyên suy luận cho mô hình suy luận lớn"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    # Cùng khoảng vLLM 0.32.0 yêu cầu, để test CPU chạy đúng phiên bản như trên GPU (ADR-013).
    "transformers>=5.16.1,<5.20",
    "jinja2>=3.1",
    "datasets>=3.0",
    "math-verify>=0.7",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Chỉ cài trên máy Linux có GPU. Trên Vast, image vllm/vllm-openai đã có sẵn vLLM đúng phiên bản (ops/vast).
gpu = ["vllm==0.32.0; sys_platform == 'linux'"]

[project.scripts]
ttalloc = "ttalloc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
]
ops = [
    "kaggle>=1.6",
    "six",  # kaggle 2.2.5 import six nhưng không khai báo phụ thuộc
    "vastai>=0.2",
    "huggingface_hub>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttalloc"]

[tool.uv]
default-groups = ["dev"]
# Khóa phụ thuộc cho cả máy phát triển (Windows) và máy GPU (Linux x86_64).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not gpu and not slow and not net' --strict-markers"
markers = [
    "gpu: cần GPU và vLLM",
    "slow: chạy lâu",
    "net: cần mạng",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["datasets.*", "math_verify.*", "transformers.*", "lightgbm.*", "sklearn.*", "scipy.*", "statsmodels.*", "pyarrow.*", "vllm.*", "sympy.*", "kaggle.*"]
ignore_missing_imports = true
