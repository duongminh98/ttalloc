# E4 ablation: Bỏ hiệu chuẩn isotonic (PLAN P3.T3, mục 7.3). So với M2 của E2 trên cùng các lần rút (cùng sim.seed).
#   uv run ttalloc estimator train --exp configs/experiments/e4/uncalibrated.yaml   (học lại theo mã băm)
#   uv run ttalloc lock --exp configs/experiments/e4/uncalibrated.yaml
#   uv run ttalloc eval-test --exp configs/locked/e4_uncalibrated_qwen3_1_7b.yaml --approved-by <tên>
extends: ../e2_main.yaml
name: e4_uncalibrated_qwen3_1_7b
methods:
  - {id: M2, policy: price_adaptive, params: {mu_min: tuned, b_max_mult: tuned}}
estimator: {calibrate: false}
