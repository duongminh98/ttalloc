# Tập dượt: đường lock -> eval-test của E2 (mô phỏng), nhưng trên val. tuned_from đặt lúc khóa:
#   ttalloc lock --exp configs/experiments/rehearsal/e2.yaml --set tuned_from=runs/<tune-rehearsal_tune...>
extends: base.yaml
name: rehearsal_e2
splits: [val]
# α ≥ 0.5: với chuỗi ≤ 1.024 token, α = 0.3 cho B = 150.546 < phần dự trữ 400 × (258 + 128 + 30) = 166.400
# (InfeasibleBudget, bản tập dượt lần 1). Lưới thật có chuỗi dài nên không gặp.
alphas: [0.5, 0.8]
batch: {composition: all}
methods:
  - {id: B2, policy: deer, params: {lambda: tuned, cap: calibrated}}
  - {id: M2, policy: price_adaptive, params: {mu_min: tuned, b_max_mult: tuned}}
  - {id: M3, policy: price_adaptive, rho_provider: curve, params: {mu_min: tuned, b_max_mult: tuned}}
tuned_from: null
sim: {draws: 20, seed: 1, workers: 2, calib_draws: 10}
