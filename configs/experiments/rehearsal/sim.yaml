# Tập dượt: lưới mô phỏng như G1 nhưng nhỏ (ops/kaggle/rehearsal.py).
extends: base.yaml
name: rehearsal_sim
splits: [val]
# α ≥ 0.5: với chuỗi ≤ 1.024 token, α = 0.3 cho B = 150.546 < phần dự trữ 400 × (258 + 128 + 30) = 166.400
# (InfeasibleBudget, bản tập dượt lần 1). Lưới thật có chuỗi dài nên không gặp.
alphas: [0.5, 0.8]
batches:
  - {composition: all}
  - {composition: balanced, n: 100}
methods:
  - {id: B2, policy: deer, params: {lambda: 0.95, cap: calibrated}}
  - {id: M2, policy: price_adaptive, params: {mu_min: 1.0e-5}}
  - {id: M3, policy: price_adaptive, rho_provider: curve, params: {mu_min: 1.0e-5}}
sim: {draws: 20, seed: 1, workers: 2, calib_draws: 10}
